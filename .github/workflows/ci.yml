name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check submission structure
        run: python check_submission.py

  test:
    runs-on: ubuntu-latest
    needs: structure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest in every day directory
        run: |
          set -e
          for d in day*/ final_project/; do
            dir="${d%/}"
            echo "=== $dir ==="
            (cd "$dir" && pytest -v)
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint tooling scripts
        run: |
          ruff check gate.py check_submission.py
          mypy gate.py check_submission.py
